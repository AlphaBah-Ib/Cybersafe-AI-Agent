═══════════════════════════════════════════════════════════════════════

```yaml
# .github/workflows/build-windows.yml
#
# Cybersafe-AI Agent — Windows build workflow (SOC-200 Phase 2 + SOC-204)
#
# Builds Windows .exe + .msi installer on tag push (v*.*.*) or
# manual workflow_dispatch.
#
# See docs/adr/ADR-001-windows-agent-stack.md for architectural rationale.

name: Build Windows Agent

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag (e.g. v1.0.0-test). Leave empty for artifact-only.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build .exe + .msi on windows-latest
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
              $version = $env:GITHUB_REF -replace 'refs/tags/v', ''
              Write-Host "Detected version from tag: $version"
          } elseif ($env:WORKFLOW_INPUT_TAG -and $env:WORKFLOW_INPUT_TAG.StartsWith('v')) {
              $version = $env:WORKFLOW_INPUT_TAG -replace '^v', ''
              Write-Host "Detected version from workflow_dispatch input: $version"
          } else {
              $version = "0.0.0-dev-$($env:GITHUB_SHA.Substring(0,7))"
              Write-Host "No tag detected; using fallback version: $version"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        env:
          WORKFLOW_INPUT_TAG: ${{ github.event.inputs.release_tag }}

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install 'pyinstaller>=6.0'

      - name: Smoke test - import all modules
        shell: pwsh
        run: |
          python -c "from cybersafe_agent.config import AgentConfig; print('config OK')"
          python -c "from cybersafe_agent.parser import line_to_event; print('parser facade OK')"
          python -c "from cybersafe_agent.parsers.linux import line_to_event; print('parsers/linux OK')"
          python -c "from cybersafe_agent.parsers.windows import line_to_event, WINDOWS_EVENT_MAPPING; print(f'parsers/windows OK ({len(WINDOWS_EVENT_MAPPING)} EventIDs mapped)')"
          python -c "from cybersafe_agent.tailer import LogTailer; print(f'tailer facade OK -> {LogTailer.__name__}')"
          python -c "from cybersafe_agent.platforms.windows import WindowsLogTailer, DEFAULT_WINDOWS_CHANNELS, DEFAULT_SECURITY_EVENT_IDS; print(f'WindowsLogTailer OK ({len(DEFAULT_WINDOWS_CHANNELS)} channels)')"

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          pyinstaller `
            packaging/windows/cybersafe-agent.spec `
            --clean `
            --noconfirm `
            --log-level=WARN

      - name: Verify build output
        shell: pwsh
        run: |
          $exePath = "dist\cybersafe-agent\cybersafe-agent.exe"
          if (-not (Test-Path $exePath)) {
              Write-Error "Build failed: $exePath not found"
              exit 1
          }
          $size = (Get-Item $exePath).Length / 1MB
          $folderSize = (Get-ChildItem dist\cybersafe-agent -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host "Built: $exePath ($([math]::Round($size, 2)) MB exe / $([math]::Round($folderSize, 2)) MB folder)"

      - name: Bundle distribution files
        shell: pwsh
        run: |
          $dest = "dist\cybersafe-agent"
          Copy-Item -Path "config.example.yaml" -Destination $dest
          Copy-Item -Path "packaging\windows\install.ps1" -Destination $dest
          Copy-Item -Path "packaging\windows\uninstall.ps1" -Destination $dest
          Copy-Item -Path "packaging\windows\README-Windows.md" -Destination $dest
          Write-Host "Bundled distribution files into $dest"

      - name: Create .exe distribution zip
        id: zip
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $zipName = "cybersafe-agent-windows-v$version.zip"
          Compress-Archive `
            -Path "dist\cybersafe-agent" `
            -DestinationPath "dist\$zipName" `
            -CompressionLevel Optimal
          $zipSize = [math]::Round((Get-Item "dist\$zipName").Length / 1MB, 2)
          Write-Host "Created dist\$zipName ($zipSize MB)"
          "zip_name=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Detect or install WiX Toolset 3.14
        shell: pwsh
        run: |
          $wixPath = $null
          if ($env:WIX -and (Test-Path "${env:WIX}bin\candle.exe")) {
              $wixPath = "${env:WIX}bin"
              Write-Host "WiX detected via WIX env var: $wixPath"
          }
          if (-not $wixPath) {
              $candidates = @(
                  "C:\Program Files (x86)\WiX Toolset v3.14\bin",
                  "C:\Program Files\WiX Toolset v3.14\bin",
                  "C:\Program Files (x86)\WiX Toolset v3.11\bin"
              )
              foreach ($c in $candidates) {
                  if (Test-Path "$c\candle.exe") {
                      $wixPath = $c
                      Write-Host "WiX detected at: $wixPath"
                      break
                  }
              }
          }
          if (-not $wixPath) {
              Write-Host "WiX not found, installing via Chocolatey..."
              choco install wixtoolset --version=3.14.0 --no-progress --yes --force --ignore-detected-reboot
              $candidates = @(
                  "C:\Program Files (x86)\WiX Toolset v3.14\bin",
                  "C:\Program Files\WiX Toolset v3.14\bin"
              )
              foreach ($c in $candidates) {
                  if (Test-Path "$c\candle.exe") {
                      $wixPath = $c
                      Write-Host "WiX installed at: $wixPath"
                      break
                  }
              }
          }
          if (-not $wixPath) {
              Write-Error "WiX Toolset could not be detected or installed"
              exit 1
          }
          $binaries = @("heat.exe", "candle.exe", "light.exe")
          $allFound = $true
          foreach ($bin in $binaries) {
              if (Test-Path "$wixPath\$bin") {
                  Write-Host "  $bin : OK"
              } else {
                  Write-Host "  $bin : MISSING"
                  $allFound = $false
              }
          }
          if (-not $allFound) {
              Write-Error "WiX Toolset binaries are not all available"
              exit 1
          }
          "WIX_BIN=$wixPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Exported WIX_BIN=$wixPath for next steps"

      - name: Auto-harvest internal files (heat.exe)
        shell: pwsh
        run: |
          $wixBin = "${env:WIX_BIN}"
          $outFile = "packaging\windows\wix\InternalFiles.wxs"
          Write-Host "Using WiX from: $wixBin"
          Write-Host "Harvesting dist\cybersafe-agent\_internal\ ..."
          & "$wixBin\heat.exe" dir "dist\cybersafe-agent\_internal" `
              -cg InternalFiles `
              -dr INSTALLFOLDER `
              -srd `
              -sreg `
              -sfrag `
              -gg `
              -ke `
              -var "var.InternalDir" `
              -out $outFile
          if ($LASTEXITCODE -ne 0) {
              Write-Error "heat.exe failed with exit code $LASTEXITCODE"
              exit 1
          }
          if (-not (Test-Path $outFile)) {
              Write-Error "heat.exe did not produce $outFile"
              exit 1
          }
          $lineCount = (Get-Content $outFile).Count
          Write-Host "Generated $outFile ($lineCount lines)"

      - name: Compile MSI (candle + light)
        id: msi
        shell: pwsh
        run: |
          $wixBin = "${env:WIX_BIN}"
          $version = "${{ steps.version.outputs.version }}"
          $msiName = "cybersafe-agent-windows-v$version.msi"
          $sourceDir = (Resolve-Path "dist\cybersafe-agent").Path
          $internalDir = (Resolve-Path "dist\cybersafe-agent\_internal").Path
          Write-Host "Using WiX from: $wixBin"
          Write-Host "Source directory : $sourceDir"
          Write-Host "Internal directory: $internalDir"
          Write-Host ""
          Write-Host "Step A : candle.exe (compile)"
          & "$wixBin\candle.exe" `
              -arch x64 `
              -ext WixUIExtension `
              -ext WixUtilExtension `
              -dSourceDir="$sourceDir" `
              -dInternalDir="$internalDir" `
              -out "dist\" `
              "packaging\windows\wix\Product.wxs" `
              "packaging\windows\wix\InternalFiles.wxs"
          if ($LASTEXITCODE -ne 0) {
              Write-Error "candle.exe failed with exit code $LASTEXITCODE"
              exit 1
          }
          Write-Host ""
          Write-Host "Step B : light.exe (link)"
          & "$wixBin\light.exe" `
              -ext WixUIExtension `
              -ext WixUtilExtension `
              -spdb `
              -out "dist\$msiName" `
              "dist\Product.wixobj" `
              "dist\InternalFiles.wixobj"
          if ($LASTEXITCODE -ne 0) {
              Write-Error "light.exe failed with exit code $LASTEXITCODE"
              exit 1
          }
          if (-not (Test-Path "dist\$msiName")) {
              Write-Error "MSI not produced: dist\$msiName"
              exit 1
          }
          $msiSize = [math]::Round((Get-Item "dist\$msiName").Length / 1MB, 2)
          Write-Host ""
          Write-Host "MSI build successful: dist\$msiName ($msiSize MB)"
          "msi_name=$msiName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload .exe.zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: cybersafe-agent-windows-v${{ steps.version.outputs.version }}-zip
          path: dist/${{ steps.zip.outputs.zip_name }}
          retention-days: 30
          compression-level: 0

      - name: Upload .msi artifact
        uses: actions/upload-artifact@v4
        with:
          name: cybersafe-agent-windows-v${{ steps.version.outputs.version }}-msi
          path: dist/${{ steps.msi.outputs.msi_name }}
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Cybersafe Agent ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/${{ steps.zip.outputs.zip_name }}
            dist/${{ steps.msi.outputs.msi_name }}
          body: |
            Cybersafe Agent Windows build.

            Two distribution options below :

            1) MSI installer (recommended for sysadmins) :
               Download the .msi file, then either double-click it
               for the wizard, or run silently with :
                   msiexec /i FILENAME.msi /qn TOKEN=csa_xxx
               Visible in Control Panel > Programs and Features.

            2) Zip + PowerShell installer :
               Download the .zip, extract it, open PowerShell as Admin
               in the extracted folder, then run :
                   .\install.ps1

            Built from commit ${{ github.sha }}.
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
```

