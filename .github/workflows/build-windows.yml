**Interactive (wizard) :**
        Double-click the .msi file -> follow the wizard     ← INDENT CASSÉ
            **Silent (for MDM/GPO/Intune) :**
````powershell                                                ← BACKTICKS ÉCHAPPENT du YAML
            msiexec /i ...
```                                                          ← idem
            Visible in Control Panel...
```

**Le problème** : nano a interprété les **triple-backticks ` ``` `** comme du Markdown et a cassé l'indentation YAML pendant le paste. C'est un bug classique avec les heredocs multi-lignes contenant des caractères spéciaux.

Le fichier fait **423 lignes** (vs ~370 attendues), donc il y a du contenu dupliqué/cassé.

