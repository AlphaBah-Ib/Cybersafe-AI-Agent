## 🔧 Fix — Section release notes simplifiée (sans triple-backticks)

Le plus simple est de **remplacer la section `body:` problématique** par une version sans triple-backticks (qui restera lisible).

### ⚙️ Solution — Recoller le fichier avec une version "sans backticks"

Je vais te livrer **le fichier complet corrigé** avec :
- ✅ Triple-backticks remplacés par indentation simple (4 espaces) — markdown valide aussi
- ✅ Aucun caractère spécial qui peut tromper nano/YAML parser

