# ════════════════════════════════════════════════════════════════════════
# Cybersafe Agent — Configuration
#
# Copie ce fichier vers /etc/cybersafe/config.yaml et personnalise-le.
# Permissions recommandées : 0640 (root:cybersafe)
#   sudo cp config.example.yaml /etc/cybersafe/config.yaml
#   sudo chown root:cybersafe /etc/cybersafe/config.yaml
#   sudo chmod 640 /etc/cybersafe/config.yaml
# ════════════════════════════════════════════════════════════════════════

# ── Token de l'agent (créé sur le dashboard Cybersafe) ──────────────────
token: csa_REMPLACE_PAR_TON_TOKEN_ICI

# ── URL de l'API Cybersafe ──────────────────────────────────────────────
api_url: https://cybersafe-ai-production.up.railway.app/api

# ── Fichiers de log à surveiller ────────────────────────────────────────
#
# Deux syntaxes sont acceptees (mixables dans la meme liste) :
#
#   1. SIMPLE (retrocompatible) — juste un chemin.
#      Le parser est detecte automatiquement par le contenu de la ligne
#      (syslog Linux ou Event Log Windows). Convient pour auth.log, syslog, etc.
#
#   2. AVANCEE (SOC-300) — objet avec type et format explicites.
#      Permet de router vers un parser dedie (nginx, et plus tard IIS, Apache).
#      Champs :
#        path   : chemin absolu du fichier
#        type   : auto (defaut) | nginx_access | nginx_error
#        format : combined (defaut nginx) | custom   [pour nginx_access]
#
sources:
  # --- Syntaxe simple (type auto) ---
  - /var/log/auth.log               # SSH, sudo, login (Ubuntu/Debian)
  # - /var/log/secure               # RHEL/CentOS/Rocky equivalent
  # - /var/log/syslog               # Systeme general

  # --- Syntaxe avancee : serveurs web nginx (SOC-300) ---
  # - path: /var/log/nginx/access.log
  #   type: nginx_access
  #   format: combined              # combined = format nginx par defaut
  # - path: /var/log/nginx/error.log
  #   type: nginx_error

# ── Buffer (optionnel, defaults raisonnables) ───────────────────────────
buffer:
  max_size: 100               # Flush dès qu'on atteint 100 events
  flush_interval: 2.0         # OU toutes les 2 secondes

# ── Spool disque (résilience SOC-022) ───────────────────────────────────
# Si l'envoi au backend échoue après tous les retries, les events sont
# persistés sur disque ici, puis rejoués au prochain succès de connexion.
# Quand le spool dépasse max_size_mb, les plus vieux fichiers sont
# supprimés en premier (FIFO).
spool:
  enabled: true                 # false pour désactiver le spool
  dir: /var/spool/cybersafe     # writable par l'utilisateur 'cybersafe'
  max_size_mb: 100              # Limite totale du spool sur disque (Mo)

# ── Logging local de l'agent ────────────────────────────────────────────
# Note : sous systemd, install.sh réécrit ce chemin vers
# /var/lib/cybersafe/agent.log pour rester compatible avec
# le hardening ProtectSystem=strict du service.
log_file: /var/log/cybersafe-agent.log
log_level: INFO               # DEBUG / INFO / WARNING / ERROR

# ── Tail (avancé) ───────────────────────────────────────────────────────
tail_poll_interval: 1.0       # Vérification toutes les 1s

# ── Retry réseau (avancé) ───────────────────────────────────────────────
retry_max_attempts: 6
retry_base_delay: 1.0
retry_max_delay: 60.0

# ════════════════════════════════════════════════════════════════════════
# Windows Event Log — SOC-200 Phase 2 (ignoré sur Linux/macOS)
# ════════════════════════════════════════════════════════════════════════
# Cette section configure les channels Event Log à surveiller sur Windows.
# Sur Linux/macOS, elle est ignorée (l agent utilise la section sources: ci-dessus).
#
# Si la section windows: est absente ou vide, l agent Windows utilisera les
# valeurs par défaut alignées MITRE ATT&CK (voir docs/adr/ADR-001).
#
# Documentation complète : docs/adr/ADR-001-windows-agent-stack.md

# windows:
#   # ── Channels Event Log à surveiller ──────────────────────────────
#   # Sélection ciblée sécurité (alignée MITRE ATT&CK + CIS Benchmarks).
#   # Le channel Sysmon est optionnel — skip silencieux si non installé.
#   channels:
#     # Tier 1 — Sécurité critique
#     - Security                                              # Auth, ACL, élévations
#     - System                                                # Services, drivers, kernel
#
#     # Tier 2 — Attaques modernes
#     - Microsoft-Windows-PowerShell/Operational              # Scripts PowerShell
#     - Microsoft-Windows-Windows Defender/Operational        # Malware, scans, quarantaines
#
#     # Tier 3 — Persistance & lateral movement
#     - Microsoft-Windows-TaskScheduler/Operational           # Tâches planifiées
#     - Microsoft-Windows-WinRM/Operational                   # Connexions remote admin
#     - Microsoft-Windows-TerminalServices-LocalSessionManager/Operational  # RDP
#
#     # Bonus (si Sysmon installé)
#     - Microsoft-Windows-Sysmon/Operational                  # EDR-like events
#
#   # ── Filtrage EventIDs sur le channel Security ────────────────────
#   # XPath natif côté kernel Windows (économie CPU massive).
#   # Pour les autres channels, tous les events sont remontés.
#   security_event_ids:
#     # Authentication (TA0001 / TA0006 MITRE ATT&CK)
#     - 4624    # Successful logon
#     - 4625    # Failed logon (brute force detection)
#     - 4647    # User initiated logoff
#     - 4648    # Logon with explicit credentials (lateral movement)
#     - 4672    # Special privileges assigned (admin login)
#     - 4673    # Sensitive privilege use
#
#     # Process & Service (TA0002 / TA0003)
#     - 4688    # Process created (KEY visibility)
#     - 4697    # Service installed (persistence)
#
#     # Object access (TA0009)
#     - 4663    # Object access (file/registry)
#
#     # Audit policy — CRITIQUE (attaquant efface ses traces)
#     - 4719    # System audit policy changed
#     - 1102    # Audit log cleared
#
#     # Account management (TA0003 / TA0004)
#     - 4720    # User account created
#     - 4722    # User account enabled
#     - 4724    # Password reset attempt
#     - 4725    # User account disabled
#     - 4728    # User added to security group
#     - 4732    # Member added to local group
#     - 4738    # User account changed
#
#     # Kerberos (TA0006 — environnements Active Directory)
#     - 4768    # TGT requested
#     - 4769    # Service ticket requested
#
#   # ── Persistance des bookmarks (récupération après reboot) ────────
#   # Dossier où l agent sauvegarde les bookmarks XML Windows.
#   # Permet de ne pas perdre d events après un Windows Update / reboot.
#   # Doit être writable par le compte de service de l agent.
#   bookmarks_dir: C:\\ProgramData\\Cybersafe\\bookmarks
